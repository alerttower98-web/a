name: fetch-models
# 1) Copies the official Meta Audiobox Aesthetics weights and the MuQ weights used by SongEval from Hugging Face
#    into this repo's Releases (tag "models"), so they can be downloaded from places that can only reach GitHub.
# 2) Builds a Python 3.13 wheelhouse of the official packages (torch CPU, audiobox_aesthetics, muq, librosa, ...),
#    so the official code can be installed offline on such machines.
# 3) Runs the official PyTorch implementations once on test audio and publishes the reference scores/tensors,
#    so a run of the same models elsewhere can be checked number for number.
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  weights:
    runs-on: ubuntu-24.04
    steps:
      - name: Download weights from Hugging Face (skipped if already mirrored)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(gh release view models --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          if echo "$have" | grep -q muq-large-msd-iter_model.safetensors && echo "$have" | grep -q audiobox-aesthetics_model.safetensors; then
            echo "weights already mirrored"; exit 0
          fi
          mkdir -p models
          curl -L --fail --retry 3 -o models/audiobox-aesthetics_model.safetensors https://huggingface.co/facebook/audiobox-aesthetics/resolve/main/model.safetensors
          curl -L --fail --retry 3 -o models/audiobox-aesthetics_config.json https://huggingface.co/facebook/audiobox-aesthetics/resolve/main/config.json
          curl -L --fail --retry 3 -o models/muq-large-msd-iter_model.safetensors https://huggingface.co/OpenMuQ/MuQ-large-msd-iter/resolve/main/model.safetensors
          curl -L --fail --retry 3 -o models/muq-large-msd-iter_config.json https://huggingface.co/OpenMuQ/MuQ-large-msd-iter/resolve/main/config.json
          sha256sum models/* > models/SHA256SUMS.txt
          NOTES="Mirrored from huggingface.co/facebook/audiobox-aesthetics (CC-BY 4.0, Meta) and huggingface.co/OpenMuQ/MuQ-large-msd-iter (CC-BY-NC 4.0, Tencent AI Lab)."
          gh release create models models/* --repo "$GITHUB_REPOSITORY" --title "models" --notes "$NOTES" \
            || gh release upload models models/* --clobber --repo "$GITHUB_REPOSITORY"

  official-run:
    needs: weights
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheelhouse of the official packages (CPU, Python 3.13)
        run: |
          mkdir -p refs wh
          python -m pip install --upgrade pip wheel
          set +e
          pip wheel -w wh --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.7.0+cpu" "torchaudio==2.7.0+cpu" "torchvision==0.22.0+cpu" "transformers==4.48.3" \
            "muq==0.1.0" audiobox_aesthetics "librosa==0.11.0" "hydra-core==1.3.2" omegaconf safetensors einops easydict soundfile \
            > refs/wheel_log.txt 2>&1
          rc=$?
          tail -50 refs/wheel_log.txt
          ls -la wh > refs/wheelhouse_list.txt; cat refs/wheelhouse_list.txt; du -sh wh
          exit $rc
      - name: Publish wheelhouse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar cf wheelhouse-cp313.tar wh
          sha256sum wheelhouse-cp313.tar > wheelhouse-cp313.sha256
          gh release upload models wheelhouse-cp313.tar wheelhouse-cp313.sha256 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Install the official packages from the wheelhouse
        run: |
          set +e
          pip install --no-index --find-links wh "torch==2.7.0+cpu" "torchaudio==2.7.0+cpu" "torchvision==0.22.0+cpu" \
            "transformers==4.48.3" "muq==0.1.0" audiobox_aesthetics "librosa==0.11.0" "hydra-core==1.3.2" omegaconf safetensors \
            einops easydict soundfile > refs/install_log.txt 2>&1
          rc=$?
          tail -30 refs/install_log.txt
          pip freeze > refs/pip_freeze.txt; cat refs/pip_freeze.txt
          git clone --depth 1 https://github.com/ASLP-lab/SongEval
          exit $rc
      - name: Run official Audiobox Aesthetics and SongEval on test audio
        run: |
          set +e
          python .github/scripts/refs_run.py > refs/run_log.txt 2>&1
          rc=$?
          cat refs/run_log.txt
          ls -la refs
          exit $rc
      - name: Upload references to the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload models refs/* --clobber --repo "$GITHUB_REPOSITORY"
